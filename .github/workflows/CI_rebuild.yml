name: CI Rebuild Index

# ---------------------------------------------------------------------------
# 触发条件 + 测试分组
# ---------------------------------------------------------------------------
# 1) push / pull_request / workflow_dispatch 时触发整条 pipeline。
# 2) rebuild-fast 在 standalone 环境运行非集群测试。
# 3) rebuild-chaos 在 3-master / 3-ps / 2-router 环境运行集群测试。
#
# 设计权衡:
#   - test_module_rebuild.py 不依赖多节点、节点启停或故障注入，使用
#     standalone 环境即可。
#   - test_cluster_rebuild.py 依赖多副本和集群故障注入，使用 docker-compose
#     集群；cluster_helpers.py 在 docker 模式下负责节点启停和日志读取。
# ---------------------------------------------------------------------------

on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  rebuild-fast:
    name: 'Rebuild standalone tests'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            docker-arch: ''
          - platform: arm64
            docker-arch: '--platform linux/arm64'

    steps:
    - uses: actions/checkout@v4

    # 构建镜像并以 `all` 模式启动单节点 Vearch，再安装 pytest 依赖。
    - uses: ./.github/actions/set_standalone_env
      with:
        build-type: github

    - name: Run standalone rebuild tests
      run: |
        cd test
        pytest test_module_rebuild.py \
          -x -rs --log-cli-level=INFO

    - name: Upload standalone logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rebuild-standalone-logs
        path: |
          test/*.log
        retention-days: 7

  # ===========================================================================
  # Job B:chaos 测试 — kill PS / master 故障注入
  # ===========================================================================
  # chaos 测试通过 test/utils/cluster_helpers.py 注入故障。该 helper 是双模式
  # 的(bare / docker),docker 模式下 kill_ps→`docker kill vearch-psN`、
  # start_ps→`docker start`、日志走 `docker exec ... cat /vearch/logs/*.log`。
  # 所以这个 job 直接使用 set_cluster_env 构建并启动 docker-compose 集群，
  # 不再单独 build 裸二进制 + cluster.sh。
  # ---------------------------------------------------------------------------
  rebuild-chaos:
    name: 'Rebuild cluster tests'
    # needs: rebuild-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            docker-arch: ''
          - platform: linux/arm64
            docker-arch: '--platform linux/arm64'
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      # cluster_helpers 也会自动探测,显式声明更稳。
      VEARCH_CLUSTER_MODE: docker

    steps:
    - uses: actions/checkout@v4

    # 复用同一套 cluster setup:build 镜像 + docker-compose up 3M/2R/3PS + 装 pytest 依赖。
    - uses: ./.github/actions/set_cluster_env
      with:
        build-type: github

    - name: Run cluster rebuild tests
      # --maxfail=3 收齐多个 failing case 的日志,而不是首发 fail 就退。
      # -p no:cacheprovider 避免 .pytest_cache 堆在 runner 上。
      # --timeout=600 + thread method:单条测试 hang 600s 后强制 fail,
      # 防止某条 chaos 测试 hang 让整个 90min job 被 GitHub 强制取消、
      # 后续测试全部得不到执行机会。
      run: |
        cd test
        pip install pytest-timeout
        pytest test_cluster_rebuild.py \
          --maxfail=3 --log-cli-level=INFO \
          --timeout=600 --timeout-method=thread \
          -p no:cacheprovider

    - name: Upload chaos logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rebuild-chaos-logs
        # docker mode 下集群日志在容器内 /vearch/logs/,host 上没有目录;
        # 这里只收 pytest 自身产物。需要容器日志时测试会按需 `docker exec` 拉取。
        path: |
          test/*.log
        retention-days: 14
