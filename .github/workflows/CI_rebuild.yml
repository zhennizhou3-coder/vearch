name: CI Rebuild Index

# ---------------------------------------------------------------------------
# Triggers + test grouping
# ---------------------------------------------------------------------------
# 1) push / pull_request / workflow_dispatch triggers the full pipeline.
# 2) rebuild-fast runs non-cluster tests in a standalone environment.
# 3) rebuild-chaos runs cluster tests in a 3-master / 3-ps / 2-router env.
#
# Design tradeoffs:
#   - test_module_rebuild.py does not depend on multiple nodes, node
#     start/stop, or fault injection, so a standalone environment is enough.
#   - test_cluster_rebuild.py depends on multi-replica and cluster fault
#     injection, so it uses the docker-compose cluster; cluster_helpers.py
#     handles node start/stop and log reads in docker mode.
# ---------------------------------------------------------------------------

on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  rebuild-fast:
    name: 'Rebuild standalone tests'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            docker-arch: ''
          - platform: arm64
            docker-arch: '--platform linux/arm64'

    steps:
    - uses: actions/checkout@v4

    # Build the image, start a single-node Vearch in `all` mode, and install
    # pytest dependencies.
    - uses: ./.github/actions/set_standalone_env
      with:
        build-type: github

    - name: Run standalone rebuild tests
      run: |
        cd test
        pytest test_module_rebuild.py \
          -x -rs --log-cli-level=INFO

    - name: Upload standalone logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rebuild-standalone-logs
        path: |
          test/*.log
        retention-days: 7

  # ===========================================================================
  # Job B: chaos tests — kill PS / master fault injection
  # ===========================================================================
  # Chaos tests inject failures through test/utils/cluster_helpers.py. That
  # helper is dual-mode (bare / docker); in docker mode kill_ps runs
  # `docker kill vearch-psN`, start_ps runs `docker start`, and logs are read
  # via `docker exec ... cat /vearch/logs/*.log`. So this job uses
  # set_cluster_env directly to build the image and bring up the
  # docker-compose cluster, instead of building the bare binary + cluster.sh
  # separately.
  # ---------------------------------------------------------------------------
  rebuild-chaos:
    name: 'Rebuild cluster tests'
    # needs: rebuild-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            docker-arch: ''
          - platform: linux/arm64
            docker-arch: '--platform linux/arm64'
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      # cluster_helpers auto-detects this too, but declaring it explicitly is
      # more robust.
      VEARCH_CLUSTER_MODE: docker

    steps:
    - uses: actions/checkout@v4

    # Reuse the same cluster setup: build image + docker-compose up 3M/2R/3PS
    # + install pytest dependencies.
    - uses: ./.github/actions/set_cluster_env
      with:
        build-type: github

    - name: Run cluster rebuild tests
      # --maxfail=3 collects logs for multiple failing cases instead of
      # exiting on the first failure.
      # -p no:cacheprovider avoids accumulating .pytest_cache on the runner.
      # --timeout=600 + thread method: a single test hanging for 600s is
      # forced to fail, so one hung chaos test cannot let GitHub cancel the
      # whole 90-min job and starve the rest of the suite.
      run: |
        cd test
        pip install pytest-timeout
        pytest test_cluster_rebuild.py \
          --maxfail=3 --log-cli-level=INFO \
          --timeout=600 --timeout-method=thread \
          -p no:cacheprovider

    - name: Upload chaos logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rebuild-chaos-logs
        # In docker mode cluster logs live inside the container at
        # /vearch/logs/, with no directory on the host; this step only
        # collects pytest's own artifacts. Container logs are pulled on
        # demand by tests via `docker exec`.
        path: |
          test/*.log
        retention-days: 14
